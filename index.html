<!-- ================= START SCREEN ================= -->
<section id="startScreen">
  <h1>Words ⇄ Expressions</h1>

    <div class="set-row">
      <span class="set-label">Translate</span>
      <div class="seg" id="segDir">
        <button data-v="w2e">Words → Expression</button>
        <button data-v="e2w">Expression → Words</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">Level</span>
      <div class="seg" id="segLevel">
        <button data-v="1">Level 1<small>sum, product…</small></button>
        <button data-v="2">Level 2<small>grouping</small></button>
        <button data-v="3">Level 3<small>variables, test style</small></button>
      </div>
    </div>
    <div class="level-example" id="levelExample"></div>
  </div>

  <div class="start-wrap">
    <button class="big" id="startBtn" onclick="startPractice()">Start ▶</button>
  </div>

  <div class="own">
    <div class="own-title">Try your own problem</div>
    <div class="own-row">
      <input id="customExpr" autocomplete="off" spellcheck="false" aria-label="Your problem" placeholder="like 5 less than twice n" onkeydown="if(event.key==='Enter') startCustom()">
      <button id="goBtn" onclick="startCustom()">Go</button>
    </div>
    <div id="ownMsg" class="feedback" aria-live="polite"></div>
    <div class="own-help">Type or paste <b>words</b> (like <i>the sum of 8 and 3, then multiplied by 6</i>) or an <b>expression</b> (like <i>3 × (n + 5)</i>).<br>You can type <b>*</b> or <b>x</b> for ×, and <b>/</b> for ÷.</div>
  </div>
</section>

<!-- ================= MAIN SCREEN ================= -->
<section id="mainScreen" class="hidden">
  <div class="topbar">
    <button class="link" onclick="showStart()">← Menu</button>
    <div class="ptitle" id="ptitle"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="problem" id="problem"></div>

  <div class="progress-wrap"><div class="bar"><div id="bar"></div></div><div id="progress" class="progress"></div></div>

<!-- ============ PURE LOGIC (tested by test.js; no DOM in here) ============ -->
<script id="logic">
"use strict";
/* ===================== basics ===================== */
class KidErr extends Error { constructor(m) { super(m); this.kid = true; } }
const kid = m => new KidErr(m);
let NID = 0;
const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, "^": 3 };
const SYM = { "+": "+", "-": "−", "*": "×", "/": "÷", "^": "^" };
const OPS4 = ["+", "-", "*", "/"];
const COMM = o => o === "+" || o === "*";
function bgcd(a, b) { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) { [a, b] = [b, a % b]; } return a || 1n; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// numbers are kept as tidy strings: "8", "-3", "2.5", "3/4"
function normNum(s) {
  s = String(s).replace(/[−–]/g, "-");
  let neg = false; if (s[0] === "-") { neg = true; s = s.slice(1); }
  if (s.includes("/")) { let [a, b] = s.split("/"); a = a.replace(/^0+(?=\d)/, ""); b = b.replace(/^0+(?=\d)/, ""); return (neg ? "-" : "") + a + "/" + b; }
  let [i, f = ""] = s.split(".");
  i = (i || "0").replace(/^0+(?=\d)/, ""); f = f.replace(/0+$/, "");
  const t = f ? i + "." + f : i;
  return (neg && !/^0$/.test(t) ? "-" : "") + t;
}
function numKey(v) { // exact rational key, so 0.5 = 1/2 and 08 = 8
  let neg = v[0] === "-"; if (neg) v = v.slice(1);
  let n, d;
  if (v.includes("/")) { const [a, b] = v.split("/"); n = BigInt(a); d = BigInt(b); }
  else { const [i, f = ""] = v.split("."); n = BigInt((i || "0") + f); d = 10n ** BigInt(f.length); }
  if (d === 0n) return "nan:" + v;
  const g = bgcd(n, d); n /= g; d /= g;
  return (neg && n !== 0n ? "-" : "") + n + "/" + d;
}
function numText(v, html) {
  const neg = v[0] === "-", a = neg ? v.slice(1) : v;
  if (a.includes("/")) {
    const [p, q] = a.split("/");
    return (neg ? "−" : "") + (html ? `<span class="frac"><span>${p}</span><span class="fbar"></span><span>${q}</span></span>` : p + "/" + q);
  }
  return (neg ? "−" : "") + a;
}
const numWords = v => (v[0] === "-" ? "negative " + v.slice(1) : v);

const N = v => ({ t: "num", v: normNum(v), id: ++NID });
const V = name => ({ t: "var", name, id: ++NID });
const lift = x => typeof x === "object" ? x : (typeof x === "string" && /^[a-z]$/.test(x) ? V(x) : N(x));
function B(op, l, r, style, swap) { return { t: "bin", op, l: lift(l), r: lift(r), style, swap: !!swap, id: ++NID }; }
const isLeaf = n => n.t !== "bin";
const isNumV = (n, v) => n.t === "num" && n.v === String(v);
const isNeg = n => n.t === "num" && n.v[0] === "-";
function clone(n, fresh) {
  const c = Object.assign({}, n); if (fresh) c.id = ++NID;
  if (n.t === "bin") { c.l = clone(n.l, fresh); c.r = clone(n.r, fresh); }
  return c;
}
function walk(n, f) { if (n.t === "bin") { walk(n.l, f); walk(n.r, f); } f(n); } // post-order: left, right, node
function opsInOrder(n) { const a = []; walk(n, x => { if (x.t === "bin") a.push(x); }); return a; }
function nodeMap(n) { const m = {}; walk(n, x => { m[x.id] = x; }); return m; }
function countOps(n) { return opsInOrder(n).length; }
function replaceIn(n, id, rep) {
  if (n.id === id) return rep;
  if (n.t !== "bin") return n;
  const l = replaceIn(n.l, id, rep), r = replaceIn(n.r, id, rep);
  return l === n.l && r === n.r ? n : Object.assign({}, n, { l, r });
}
// tree in the order it is written (× and + may be flipped by the student)
const kids = n => (n.swap && COMM(n.op) ? [n.r, n.l] : [n.l, n.r]);
function dispTree(n) {
  if (n.t !== "bin") return Object.assign({}, n);
  const [a, b] = kids(n);
  return Object.assign({}, n, { l: dispTree(a), r: dispTree(b), swap: false });
}

/* ===================== same meaning? ===================== */
// + and × may swap; parentheses that change nothing are fine; − and ÷ keep their order.
function canon(n) {
  if (n.t === "num") return "#" + numKey(n.v);

    while (stack.length && stack[stack.length - 1] <= i) { html += "</span>"; stack.pop(); }
    if (i > 0 && t.w !== ",") html += " ";
    while (m < marks.length && marks[m][0] === i) { html += `<span class="${marks[m][2]}">`; stack.push(marks[m][1]); m++; }
    html += (badgeAt[i] || "") + esc(t.w);
  });
  while (stack.length) { html += "</span>"; stack.pop(); }
  return html;
}
function writtenTree() { return P.mcChoice && P.mcChoice.tree ? P.mcChoice.tree : P.tree; }
function lineFor(s, cur) { // what that step put on paper (cur: the line being written now, with the earlier part in green)
  if (s.type === "copy") return { html: exprHTML(P.tree), words: false };
  if (s.final) return P.dir === "w2e" ? { html: exprHTML(writtenTree()), words: false } : { html: esc(fullWords(P)), words: true };
  if (P.dir === "w2e") { const d = cur ? doneSet() : null; if (d) d.delete(s.id); return { html: exprHTML(P.nodes[s.id], d ? { done: d } : {}), words: false, node: s.id }; }
  return { html: esc(pieceWords(P, s.id)), words: true };
}
function renderProblem(s) {
  const done = doneSet();
  let o = { done };
  if (["piece", "words"].includes(s.type)) o.target = s.id;
  if (s.type === "gate" && s.id) o.target = s.id;
  if (s.type === "sense" || s.type === "done") o = { badges: P.rank };
  if (s.type === "mcas" || (s.type === "gate" && s.final)) o = {};
  const label = P.dir === "w2e" ? "📝 The words" : "🔢 The expression";
  const body = P.dir === "w2e" ? `<div class="words" id="probText">${wordsHTML(o)}</div>` : `<div class="expr-big expr" id="probText">${exprHTML(P.tree, o)}</div>`;
  document.getElementById("problem").innerHTML = `<div class="problem-label">${label}</div>${body}`;
}
function renderPaper(s) {
  let html = `<div class="paper-label">📄 Your paper</div>`, any = false;
  for (let i = 0; i < idx; i++) { const t = P.steps[i]; if (t.type === "gate" || t.type === "copy") { const l = lineFor(t); html += `<div class="line expr ${l.words ? "wline" : ""}">${l.html}</div>`; any = true; } }
  if (s.type === "gate" || s.type === "copy") { const l = lineFor(s, true); html += `<div class="line cur expr ${l.words ? "wline" : ""}" id="curLine">${l.html}</div>`; any = true; }
  if (!any) html += `<div class="paper-empty">Nothing yet. You'll write each piece here, one line at a time.</div>`;
  document.getElementById("paper").innerHTML = html;
}
function choiceButtons(s, opts, stack, lettered) {
  const wrong = new Set(s.picked || []);
  return `<div class="choices ${stack ? "stack" : ""}">${opts.map((o, i) => {
    const w = wrong.has(i), r = rightPick === i;
    const lead = lettered ? `<span class="letter">${"ABCD"[i]}</span>` : "";
    const mark = w ? `<span class="mark">✗</span>` : r ? `<span class="mark">✓</span>` : "";
    const body = o.html ? `<span class="ch expr">${o.html}</span>` : `<span class="ch">${esc(o.text)}</span>`;
    return `<button class="choice ${lettered ? "mc" : ""} ${w ? "wrong" : ""} ${r ? "right" : ""}" data-i="${i}" ${w ? "disabled" : ""} onclick="pick(${i})">${lead}${body}${mark}</button>`;
  }).join("")}</div>`;
}
function render() {
  const s = P.steps[idx];
  renderProblem(s);
  renderPaper(s);
  const box = document.getElementById("step");
  let html = "";
  const hs = hintsFor(P, s), shown = s.hints || 0;
  const hintBlock = () => shown ? `<div class="hints">${hs.slice(0, shown).map(h => `<div class="hintline"><span class="tag">${h.tag}</span>${h.text}</div>`).join("")}</div>` : "";
  const coachBlock = () => s.coach ? `<div id="feedback" class="feedback coach">${s.coach}</div>` : `<div id="feedback" class="feedback"></div>`;
  const check = `<label class="gate-check"><input type="checkbox" id="gateBox" onchange="gateTapped(this)" onkeydown="if(event.key==='Enter'){this.checked=true;gateTapped(this)}"> I wrote it</label>`;
  const gatesBefore = P.steps.slice(0, idx).filter(t => t.type === "gate" || t.type === "copy").length;

  if (s.type === "copy") {
    html += `<div class="gate-head">✏️ Copy the expression</div><div class="gate-text">Write it at the top of your paper:</div>`;
    html += `<div class="gate-line expr">${exprHTML(P.tree)}</div>`;
    const notes = [];
    if (P.implicit) notes.push("A number right next to a letter or a ( means multiply, so we wrote the × sign in. Write the × too.");
    if (P.custom && /[*\/x]/i.test(P.src.replace(/[a-wyz]/gi, ""))) notes.push("We use × for times and ÷ for divide.");
    notes.push("Then you'll write it in words, one piece at a time.");
    html += `<div class="gate-note">${notes.join(" ")}</div>` + check;
  } else if (s.type === "piece") {
    html += `<div class="ask">What do the <span class="hlw">highlighted words</span> mean?<small>Pick what you would write.</small></div>`;
    html += choiceButtons(s, optsFor(s), false, false) + coachBlock() + hintBlock();
  } else if (s.type === "words") {
    html += `<div class="ask">Which words match the <span class="hlw">highlighted part</span>?</div>`;
    html += choiceButtons(s, optsFor(s), true, false) + coachBlock() + hintBlock();
  } else if (s.type === "first") {
    const first = !P.steps.slice(0, idx).some(t => t.type === "words");
    html += `<div class="ask">${first ? "Which part do you do first?" : "Which part comes next?"}<small>That's the part to put into words ${first ? "first" : "next"}.</small></div>`;
    html += choiceButtons(s, s.opts, false, false) + coachBlock() + hintBlock();
  } else if (s.type === "mcas") {
    html += `<div class="ask">${P.dir === "w2e" ? "Which expression matches the words?" : "Which words match the expression?"}${P.walked ? "<small>Now use what you built on your paper.</small>" : "<small>Like a test question: pick one.</small>"}</div>`;
    html += choiceButtons(s, optsFor(s), true, true) + coachBlock() + hintBlock();
    if (!P.walked) html += `<div class="walk"><button class="link" id="walkBtn" onclick="walkThrough()">🧩 Walk me through it, one piece at a time</button></div>`;
  } else if (s.type === "gate") {
    const l = lineFor(s, true);
    const prev = P.steps[idx - 1];
    let did = "✓ Correct!";
    if (prev && prev.swapped) did += ` <span style="font-weight:normal">Both ways mean the same thing — you can multiply in either order.</span>`;
    if (s.mc) did = `✓ Correct! It's choice ${"ABCD"[optsFor(prev).indexOf(P.mcChoice)]}.`;
    html += `<div class="did">${did}</div><div class="gate-head">✏️ Write this on your paper</div>`;
    html += `<div class="gate-text">${gatesBefore ? "Write it on the next line:" : "Write it on the first line:"}</div>`;
    html += `<div class="gate-line expr ${l.words ? "wline" : ""}">${l.html}</div>`;
    const last = s.final || s.id === P.order[P.order.length - 1];
    let note = "";
    if (last) note = P.dir === "w2e" ? "That's your whole expression!" : "That's the whole expression in words!";
    else note = P.dir === "w2e" ? "This is what the highlighted words mean." : "These words go with the highlighted part.";
    if (!s.final && P.nodes[s.id] && opsInOrder(P.nodes[s.id]).length > 1) note += P.dir === "w2e" ? " The green part is what you already wrote. Copy it in, just like this." : " The green part is what you already wrote. Use those words inside.";
    if (P.dir === "w2e" && !s.final && P.nodes[s.id].op === "*" && !isLeaf(P.nodes[s.id].l) !== !isLeaf(P.nodes[s.id].r)) note += " Write the × sign — don't leave it out.";
    html += `<div class="gate-note">${note}</div>` + check;
  } else if (s.type === "sense") {
    const wt = writtenTree();
    html += `<div class="ask">🤔 Does the order of operations in your expression match the order of the words?</div>`;
    html += `<div class="sense"><div class="sense-row"><span class="lbl">The words</span><div class="words">${wordsHTML({ badges: P.rank })}</div></div>`;
    html += `<div class="sense-row"><span class="lbl">${P.dir === "w2e" ? "Your expression" : "The expression"}</span><div class="expr">${exprHTML(wt, { badges: P.rank })}</div></div>`;
    html += `<div class="sense-note">${P.order.length > 1 ? "① happens first, then ②" + (P.order.length > 2 ? ", and so on" : "") + ". Check that each number is on the same kind of step in both." : "Check: is it the same operation, with the numbers in the same order?"}</div></div>`;
    if (!P.roughNo) html += `<div class="input-area"><button class="yn" id="yesBtn" onclick="answerSense(true)">Yes</button><button class="yn" id="noBtn" onclick="answerSense(false)">No</button></div>`;
    else html += `<div id="feedback" class="feedback coach">Good thinking to check! Find ① in the words and ① in ${P.dir === "w2e" ? "your expression" : "the expression"}. Do they match? Then check ②. Fix any part on your paper that's different.</div><div class="input-area"><button class="check" id="matchBtn" onclick="P.reasonOk=true;advance()">My paper matches now ✓</button></div>`;
  }
  box.innerHTML = html;
  box.classList.toggle("hidden", s.type === "done");
  box.classList.toggle("gate", s.type === "gate" || s.type === "copy");

  const fin = document.getElementById("final");
  if (s.type === "done") {
    fin.classList.remove("hidden");
    const head = P.revealed ? "Finished! This one doesn't count because you saw the solution. Try the next one on your own 💪" : "🎉 You did it! Does your paper match?";
    const w = `<i>${esc(fullWords(P))}</i>`, e = `<span class="expr">${exprHTML(writtenTree())}</span>`;
    fin.innerHTML = `<div style="font-size:1rem;font-weight:normal;margin-bottom:6px">${head}</div><div class="pair-final">${P.dir === "w2e" ? w + "<br>→ " + e : e + "<br>→ " + w}</div>`
      + (P.reasonOk && !P.revealed ? `<div class="reason-ok"><span class="big-check">✓</span><span>The order matches!</span></div>` : "")
      + (P.fadedNow ? `<div class="faded-note">You're on a roll! Hints will stay out of the way now. Tap 💡 Hint any time you want one.</div>` : "")
      + `<div class="controls" style="margin-top:14px"><button id="nextBtn" class="big" onclick="nextProblem()">${P.key === "custom" ? "Try another problem →" : "Next problem →"}</button></div>`;
  } else fin.classList.add("hidden");

  // controls
  document.getElementById("backBtn").disabled = idx === 0 || s.type === "done";
  const hb = document.getElementById("hintBtn");
  const hintable = ["piece", "words", "first", "mcas"].includes(s.type);
  hb.disabled = !hs.length || shown >= hs.length;
  hb.className = (hintable ? "" : "hidden ") + (S.auto[P.key] ? "auto" : "faded");
  hb.textContent = shown ? `💡 Another hint (${shown}/${hs.length})` : "💡 Hint";
  if (shown >= hs.length && hs.length) hb.textContent = "💡 No more hints";
  const solOpen = !document.getElementById("solution").classList.contains("hidden");
  document.getElementById("solBtn").classList.toggle("hidden", P.key === "custom" || s.type === "done" || solOpen);
  document.getElementById("stats").innerHTML = `<span title="Problems solved">⭐ <b id="solvedN">${S.solved}</b></span> &nbsp;<span title="In a row">🔥 <b id="streakN">${S.streak}</b></span>`;
  const total = P.steps.length - 1;
  document.getElementById("bar").style.width = Math.round(100 * idx / total) + "%";
  document.getElementById("progress").textContent = s.type === "done" ? `Solved: ${S.solved} · In a row: ${S.streak}` : `Step ${idx + 1} of ${total}`;

  const focusEl = document.getElementById("gateBox") || document.getElementById("yesBtn") || document.getElementById("matchBtn") || document.querySelector(".choice:not(:disabled)") || document.getElementById("nextBtn");
  if (focusEl && !solOpen) focusEl.focus({ preventScroll: true });
  const target = s.type === "done" ? fin : document.getElementById("controls");
  if (!solOpen && target.getBoundingClientRect().bottom > window.innerHeight) target.scrollIntoView({ block: "end", behavior: "smooth" });
}
</script>
</body>
</html>
